services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: chadkrishi
      MARIADB_USER: chadkrishi
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      DATABASE_DSN: chadkrishi:${DB_PASSWORD}@tcp(db:3306)/chadkrishi?parseTime=true&charset=utf8mb4
      WEATHER_CACHE_MINUTES: 30
    volumes:
      - uploads:/data
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
